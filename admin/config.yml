# TOM TED TOD 管理画面（Decap CMS）設定
# 公開ステータス: public = 表示 / sample = プレビューのみ表示 / draft = 非表示
backend:
  name: github
  repo: swarmlabel721-create/swarmproject
  branch: main
media_folder: images
public_folder: /images
locale: ja
collections:
- name: artworks
  label: ARCHIVE（作品）
  folder: content/artworks
  format: json
  extension: json
  create: true
  slug: '{{fields.id}}'
  identifier_field: id
  summary: '{{id}} — {{title}}'
  fields:
  - label: 作品ID（例 TT-C002）
    name: id
    widget: string
  - label: 作品名
    name: title
    widget: string
  - label: 制作年
    name: year
    widget: string
    required: false
  - label: 種別
    name: kind
    widget: select
    options:
    - label: カスタム作品
      value: custom
    - label: 素体
      value: base
    default: custom
  - label: 並び順（小さいほど先）
    name: order
    widget: number
    default: 10
  - label: 公開ステータス
    name: status
    widget: select
    options:
    - public
    - draft
    - sample
    default: draft
  - label: 作家
    name: artist
    widget: relation
    collection: artists
    value_field: id
    search_fields:
    - display_name
    - id
    display_fields:
    - display_name
    required: false
  - label: 写真
    name: images
    widget: list
    required: false
    fields:
    - label: 画像
      name: src
      widget: image
    - label: 代替テキスト（何が写っているか）
      name: alt
      widget: string
    - label: 撮影者・権利者
      name: credit
      widget: string
      required: false
  - label: 技法・素材
    name: technique
    widget: string
    required: false
  - label: 文化的背景
    name: context
    widget: string
    required: false
  - label: 作品解説
    name: description
    widget: text
    required: false
  - label: 活動履歴（展示・動画・掲載など。ENCOUNTERS/SIGNALSに登録したものは自動で表示）
    name: history
    widget: list
    required: false
    fields:
    - label: 日付（YYYY.MM.DD）
      name: date
      widget: string
    - label: 種別
      name: type
      widget: select
      options:
      - EXHIBITION
      - POP-UP
      - VIDEO
      - MEDIA
      - SNS
      - OTHER
    - label: タイトル
      name: title
      widget: string
    - label: 場所
      name: place
      widget: string
      required: false
    - label: 説明
      name: description
      widget: text
      required: false
    - label: リンク
      name: url
      widget: string
      required: false
  - label: 関連リンク
    name: links
    widget: list
    required: false
    fields:
    - label: 表示名
      name: label
      widget: string
    - label: URL
      name: url
      widget: string
  - label: 許諾メモ（サイトには出ません）
    name: rights_note
    widget: text
    required: false
- name: logs
  label: EARTH LOG（地球滞在ログ）
  folder: content/logs
  format: json
  extension: json
  create: true
  slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
  fields:
  - label: ID
    name: id
    widget: string
  - label: タイトル
    name: title
    widget: string
  - label: 日付（YYYY.MM.DD）
    name: date
    widget: string
  - label: 場所
    name: place
    widget: string
  - label: 本文
    name: body
    widget: text
  - label: 写真
    name: images
    widget: list
    required: false
    fields:
    - label: 画像
      name: src
      widget: image
    - label: 代替テキスト
      name: alt
      widget: string
    - label: 撮影者・権利者
      name: credit
      widget: string
      required: false
  - label: 関連作品
    name: artworks
    widget: relation
    collection: artworks
    value_field: id
    search_fields:
    - id
    - title
    display_fields:
    - id
    multiple: true
    required: false
  - label: 公開ステータス
    name: status
    widget: select
    options:
    - public
    - draft
    - sample
    default: draft
- name: events
  label: ENCOUNTERS（展示・協業）
  folder: content/events
  format: json
  extension: json
  create: true
  slug: '{{fields.id}}'
  fields:
  - label: ID（英数字）
    name: id
    widget: string
  - label: タイトル
    name: title
    widget: string
  - label: 日付（YYYY.MM.DD）
    name: date
    widget: string
  - label: 種別
    name: type
    widget: select
    options:
    - EXHIBITION
    - GALLERY
    - POP-UP
    - COLLABORATION
    - PROJECT
  - label: 場所
    name: place
    widget: string
    required: false
  - label: 説明
    name: description
    widget: text
    required: false
  - label: 関連作品（この作品ページの履歴に自動追加）
    name: artworks
    widget: relation
    collection: artworks
    value_field: id
    search_fields:
    - id
    - title
    display_fields:
    - id
    multiple: true
    required: false
  - label: 関連作家
    name: artists
    widget: relation
    collection: artists
    value_field: id
    search_fields:
    - display_name
    display_fields:
    - display_name
    multiple: true
    required: false
  - label: 関連リンク
    name: links
    widget: list
    required: false
    fields:
    - label: 表示名
      name: label
      widget: string
    - label: URL
      name: url
      widget: string
  - label: 公開ステータス
    name: status
    widget: select
    options:
    - public
    - draft
    - sample
    default: draft
- name: news
  label: SIGNALS（お知らせ）
  folder: content/news
  format: json
  extension: json
  create: true
  slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
  fields:
  - label: ID
    name: id
    widget: string
  - label: タイトル
    name: title
    widget: string
  - label: 日付（YYYY.MM.DD）
    name: date
    widget: string
  - label: 種別
    name: type
    widget: select
    options:
    - EXHIBITION
    - EVENT
    - VIDEO
    - SYSTEM
  - label: 本文
    name: body
    widget: text
  - label: 関連作品
    name: artworks
    widget: relation
    collection: artworks
    value_field: id
    search_fields:
    - id
    - title
    display_fields:
    - id
    multiple: true
    required: false
  - label: 関連リンク
    name: links
    widget: list
    required: false
    fields:
    - label: 表示名
      name: label
      widget: string
    - label: URL
      name: url
      widget: string
  - label: 公開ステータス
    name: status
    widget: select
    options:
    - public
    - draft
    - sample
    default: draft
- name: artists
  label: ARTISTS（参加作家）
  folder: content/artists
  format: json
  extension: json
  create: true
  slug: '{{fields.id}}'
  fields:
  - label: ID（英数字）
    name: id
    widget: string
  - label: 公開名義（匿名なら ANONYMOUS など）
    name: display_name
    widget: string
  - label: 名義の扱い
    name: name_policy
    widget: select
    options:
    - 実名
    - 活動名
    - 匿名
    required: false
  - label: 紹介文
    name: bio
    widget: text
    required: false
  - label: 関連リンク
    name: links
    widget: list
    required: false
    fields:
    - label: 表示名
      name: label
      widget: string
    - label: URL
      name: url
      widget: string
  - label: 公開ステータス
    name: status
    widget: select
    options:
    - public
    - draft
    - sample
    default: draft
- name: site
  label: サイト文言
  files:
  - name: site
    label: 共通の文言
    file: content/site.json
    fields:
    - label: 名前
      name: name
      widget: string
    - label: HERO 見出し
      name: hero_title
      widget: string
    - label: HERO 英語
      name: hero_en
      widget: string
    - label: HERO 英語サブ
      name: hero_en_sub
      widget: string
    - label: HERO 日本語
      name: hero_ja
      widget: text
    - label: HERO 画像
      name: hero_image
      widget: image
    - label: HERO 画像の代替テキスト
      name: hero_image_alt
      widget: string
    - label: ORIGIN 本文
      name: origin_lead
      widget: text
    - label: ORIGIN 項目
      name: origin_points
      widget: list
      fields:
      - label: ラベル
        name: label
        widget: string
      - label: 本文
        name: text
        widget: text
    - label: ARCHIVE 導入
      name: archive_intro
      widget: text
    - label: EARTH LOG 導入
      name: earthlog_intro
      widget: text
    - label: ENCOUNTERS 導入
      name: encounters_intro
      widget: text
    - label: SIGNALS 導入
      name: signals_intro
      widget: text
    - label: COLLABORATION 導入
      name: collab_intro
      widget: text
    - label: CONNECT の注意書き
      name: connect_notes
      widget: list
      field:
        label: 項目
        name: item
        widget: string
    - label: X URL
      name: x_url
      widget: string
    - label: X アカウント
      name: x_handle
      widget: string
